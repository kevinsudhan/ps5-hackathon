<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Promise Graph: demo video</title>
<meta name="viewport" content="width=1920">
<!--
  The Promise Graph demo video as one page that can paint any moment t exactly (window.__seek).
  Timing comes from build/timeline.json (voice.py); the page lists its sound cues (window.__cues)
  for audio.py; render.mjs captures it frame by frame. Real app footage is in clips/ (capture.mjs),
  all-intra, so every frame seeks exactly. Every figure on screen is from the live app (Oct 18).
-->
<style>
@font-face { font-family: Inter; src: url(assets/inter.woff2) format('woff2'); font-weight: 100 900; }
:root {
  --bg: #1E2340; --bg-deep: #12152A; --surface: rgba(46,54,90,.74); --surface-solid: #2E365A; --raised: rgba(58,67,108,.9);
  --border: rgba(162,134,156,.24); --border-strong: rgba(146,161,194,.4);
  --text: #F1EEF6; --text-2: #92A1C2; --mauve: #A2869C; --purple: #6B597F; --peri: #92A1C2; --steel: #3F5B8D;
  --danger: #BD6C73; --danger-text: #E8A3A9; --delayed: #D9A86C; --ok: #7FB59A; --falkor: #8EA6FF; --pg: #D9A86C;
  --mono: 'Cascadia Mono', 'Cascadia Code', Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg-deep); }
body { font-family: Inter, 'Segoe UI', sans-serif; color: var(--text); -webkit-font-smoothing: antialiased; font-feature-settings: 'cv11','ss01'; }
#stage { position: absolute; inset: 0; overflow: hidden;
  background: radial-gradient(ellipse 80% 70% at 50% 35%, #262C52 0%, #1E2340 45%, #12152A 100%); }
#grid { position: absolute; inset: 0; opacity: .5;
  background-image: radial-gradient(rgba(146,161,194,.16) 1.2px, transparent 1.3px); background-size: 36px 36px; }
#net { position: absolute; inset: 0; }
.scene { position: absolute; inset: 0; opacity: 0; will-change: opacity, transform; }
.abs { position: absolute; }
.center { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
.kick { font-size: 22px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--text-2); }
.h-xl { font-size: 104px; font-weight: 750; letter-spacing: -.035em; line-height: 1.02; }
.h-l { font-size: 72px; font-weight: 720; letter-spacing: -.03em; line-height: 1.06; }
.h-m { font-size: 48px; font-weight: 680; letter-spacing: -.02em; line-height: 1.12; }
.muted { color: var(--text-2); }
.danger { color: var(--danger-text); } .ok { color: var(--ok); } .amber { color: var(--delayed); } .blue { color: var(--falkor); }
.word { display: inline-block; white-space: pre; will-change: transform, opacity; }
.card { position: absolute; background: var(--surface); border: 1px solid var(--border); border-radius: 22px;
  box-shadow: 0 30px 80px rgba(5,6,18,.45), inset 0 1px 0 rgba(255,255,255,.05); backdrop-filter: blur(14px); }
.pill { display: inline-flex; align-items: center; gap: 10px; padding: 8px 18px; border-radius: 999px; font-size: 22px; font-weight: 650;
  background: rgba(46,54,90,.8); border: 1px solid var(--border-strong); }
.pill.red { background: rgba(189,108,115,.18); border-color: rgba(189,108,115,.6); color: var(--danger-text); }
.pill.green { background: rgba(127,181,154,.16); border-color: rgba(127,181,154,.55); color: var(--ok); }
.pill.amber { background: rgba(217,168,108,.15); border-color: rgba(217,168,108,.55); color: var(--delayed); }
.pill.blue { background: rgba(142,166,255,.13); border-color: rgba(142,166,255,.5); color: #C9D4FF; }
.dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
.tag { font-family: var(--mono); font-size: 19px; padding: 4px 12px; border-radius: 8px; background: rgba(142,166,255,.12);
  border: 1px solid rgba(142,166,255,.38); color: #C9D4FF; white-space: nowrap; }
/* the browser frame around real footage */
.frame { position: absolute; border-radius: 18px; overflow: hidden; background: #171B33; border: 1px solid rgba(146,161,194,.3);
  box-shadow: 0 50px 120px rgba(3,4,14,.65), 0 0 0 1px rgba(255,255,255,.03); transform-origin: 50% 50%; }
.frame .bar { height: 44px; display: flex; align-items: center; gap: 9px; padding: 0 18px; background: #232845; border-bottom: 1px solid rgba(146,161,194,.18); }
.frame .bar i { width: 13px; height: 13px; border-radius: 50%; background: #4A5078; }
.frame .bar i:nth-child(1) { background: #BD6C73; } .frame .bar i:nth-child(2) { background: #D9A86C; } .frame .bar i:nth-child(3) { background: #7FB59A; }
.frame .bar span { margin-left: 18px; font-size: 17px; color: var(--text-2); background: rgba(23,27,51,.7); padding: 5px 16px; border-radius: 8px; }
.frame .view { position: absolute; left: 0; right: 0; top: 44px; bottom: 0; overflow: hidden; }
.frame video { position: absolute; left: 0; top: 0; width: 100%; height: auto; transform-origin: 0 0; }
.callout { position: absolute; padding: 14px 24px; border-radius: 16px; background: rgba(23,27,51,.92); border: 1px solid var(--border-strong);
  font-size: 30px; font-weight: 650; box-shadow: 0 20px 50px rgba(0,0,0,.4); white-space: nowrap; }
.callout small { display: block; font-size: 19px; font-weight: 500; color: var(--text-2); margin-top: 2px; }
.stamp { position: absolute; padding: 18px 34px; border: 5px solid; border-radius: 16px; font-size: 54px; font-weight: 850; letter-spacing: .04em;
  text-transform: uppercase; background: rgba(18,21,42,.88); }
.stamp small { display: block; font-size: 24px; font-weight: 600; letter-spacing: 0; text-transform: none; margin-top: 4px; }
/* captions */
#cap { position: absolute; left: 50%; bottom: 46px; transform: translateX(-50%); max-width: 1500px; text-align: center; z-index: 50;
  font-size: 34px; font-weight: 560; line-height: 1.3; padding: 12px 30px; border-radius: 16px; background: rgba(12,14,30,.72);
  border: 1px solid rgba(146,161,194,.16); backdrop-filter: blur(8px); opacity: 0; }
#wm { position: absolute; right: 44px; top: 34px; z-index: 40; display: flex; align-items: center; gap: 12px; font-size: 22px; font-weight: 650; opacity: 0; }
.brand-mark { border-radius: 30%; background: conic-gradient(from 210deg, #8EA6FF, #A2869C, #BD6C73, #D9A86C, #8EA6FF); }
#wm .brand-mark { width: 30px; height: 30px; }
/* code */
.code { font-family: var(--mono); font-size: 22px; line-height: 1.55; white-space: pre; color: #C9D0E6; }
.code .k { color: #C9A6E6; } .code .l { color: #8EA6FF; } .code .s { color: var(--delayed); } .code .c { color: #6E7899; }
.code .hl { background: rgba(142,166,255,.18); border-radius: 6px; box-shadow: 0 0 0 2px rgba(142,166,255,.45); }
/* chain cards (problem scene) */
.ship { position: absolute; width: 330px; padding: 20px 22px; border-radius: 18px; background: var(--surface-solid); border: 1px solid var(--border);
  box-shadow: 0 20px 50px rgba(0,0,0,.35); }
.ship .t { font-size: 24px; font-weight: 680; line-height: 1.2; }
.ship .s { font-size: 18px; color: var(--text-2); margin-top: 6px; }
.ship .d { margin-top: 12px; font-size: 22px; font-weight: 700; }
.agent { position: absolute; left: 0; width: 640px; height: 112px; padding: 18px 24px; border-radius: 18px; background: var(--surface);
  border: 1px solid var(--border); display: grid; grid-template-columns: 56px 1fr; gap: 6px 18px; align-items: center; }
.agent .n { grid-row: span 2; width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; font-size: 26px; font-weight: 800; background: rgba(142,166,255,.14); color: #C9D4FF; }
.agent .a { font-size: 28px; font-weight: 720; display: flex; gap: 14px; align-items: center; }
.agent .r { font-size: 21px; color: var(--text-2); }
.check { display: flex; gap: 16px; align-items: flex-start; font-size: 27px; font-weight: 560; margin: 14px 0; }
.check b { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: rgba(127,181,154,.2); color: var(--ok); font-size: 20px; }
svg text { font-family: Inter, sans-serif; }
</style>
</head>
<body>
<div id="stage">
  <div id="grid"></div>
  <svg id="net" width="1920" height="1080"></svg>
  <div id="scenes"></div>
  <div id="wm"><span class="brand-mark"></span>Promise Graph</div>
  <div id="cap"></div>
</div>
<script>
// ------------------------------------------------------------------ helpers
const W = 1920, H = 1080;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const P = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, x) => a + (b - a) * x;
const E = {
  out: (x) => 1 - Math.pow(1 - x, 3),
  out5: (x) => 1 - Math.pow(1 - x, 5),
  inout: (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2),
  back: (x) => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
};
const $ = (html) => { const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstElementChild; };
const NS = 'http://www.w3.org/2000/svg';
const S = (tag, attrs = {}, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const fmt = (n) => Math.round(n).toLocaleString('en-US');
const usd = (n) => '$' + fmt(n);
const set = (el, o, tf, extra) => { el.style.opacity = o; if (tf !== undefined) el.style.transform = tf; if (extra) Object.assign(el.style, extra); };
// rise in: opacity + translateY + slight blur, between a and a+d
const rise = (el, t, a, d = 0.6, dy = 30, base = '') => { const x = E.out(P(t, a, a + d)); set(el, x, `${base} translateY(${(1 - x) * dy}px)`); return x; };
// kinetic words
function words(el, text) { el.innerHTML = text.split(' ').map((w) => `<span class="word">${w} </span>`).join(''); return [...el.querySelectorAll('.word')]; }
function wordsIn(ws, t, a, stagger = 0.07, d = 0.55) {
  ws.forEach((w, i) => { const x = E.out(P(t, a + i * stagger, a + i * stagger + d)); w.style.opacity = x; w.style.transform = `translateY(${(1 - x) * 40}px)`; w.style.filter = `blur(${(1 - x) * 8}px)`; });
}
// a rendered number that counts up
const count = (t, a, d, to) => to * E.out5(P(t, a, a + d));

// ------------------------------------------------------------------ the world (approximate equirectangular, cropped)
const PORTS = {
  CNSHA: ['Shanghai', 31.23, 121.47], KRPUS: ['Busan', 35.1, 129.04], CNYTN: ['Shenzhen', 22.57, 114.27], VNSGN: ['Ho Chi Minh City', 10.76, 106.79],
  SGSIN: ['Singapore', 1.26, 103.84], MYPKG: ['Port Klang', 3.0, 101.39], LKCMB: ['Colombo', 6.95, 79.85], BDCGP: ['Chittagong', 22.31, 91.8],
  INNSA: ['Nhava Sheva', 18.95, 72.95], AEJEA: ['Jebel Ali', 25.01, 55.06], EGPSD: ['Port Said', 31.26, 32.3], ESALG: ['Algeciras', 36.13, -5.44],
  NLRTM: ['Rotterdam', 51.95, 4.14], DEHAM: ['Hamburg', 53.54, 9.97], GBFXT: ['Felixstowe', 51.96, 1.35], USLAX: ['Los Angeles', 33.74, -118.27],
  USNYC: ['New York', 40.68, -74.15], USSAV: ['Savannah', 32.08, -81.09], TWKHH: ['Kaohsiung', 22.61, 120.28],
};
const LANES = [['CNSHA','SGSIN'],['KRPUS','CNSHA'],['CNYTN','SGSIN'],['TWKHH','CNYTN'],['VNSGN','SGSIN'],['SGSIN','MYPKG'],['SGSIN','LKCMB'],['BDCGP','LKCMB'],
  ['LKCMB','INNSA'],['INNSA','AEJEA'],['LKCMB','AEJEA'],['AEJEA','EGPSD'],['LKCMB','EGPSD'],['EGPSD','ESALG'],['ESALG','NLRTM'],['NLRTM','DEHAM'],['NLRTM','GBFXT'],
  ['CNSHA','USLAX'],['KRPUS','USLAX'],['ESALG','USNYC'],['NLRTM','USNYC'],['USNYC','USSAV'],['CNYTN','USLAX']];
function proj(lat, lon, box) {   // box = {x, y, w, h, lon0, lon1, lat0, lat1}
  return [box.x + (lon - box.lon0) / (box.lon1 - box.lon0) * box.w, box.y + (box.lat1 - lat) / (box.lat1 - box.lat0) * box.h];
}
function arcPath(a, b, bend = 0.18) {
  const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2, dx = b[0] - a[0], dy = b[1] - a[1];
  return `M${a[0]},${a[1]} Q${mx - dy * bend},${my + dx * bend - Math.hypot(dx, dy) * bend * 0.6} ${b[0]},${b[1]}`;
}

// ------------------------------------------------------------------ the background network (deterministic drift)
const net = document.getElementById('net');
const rnd = (() => { let s = 7; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();
const NODES = Array.from({ length: 46 }, () => ({ x: rnd() * W, y: rnd() * H, r: 1.6 + rnd() * 2.4, p: rnd() * 6.28, s: 0.15 + rnd() * 0.35 }));
const EDGES = [];
NODES.forEach((a, i) => NODES.forEach((b, j) => { if (j > i && Math.hypot(a.x - b.x, a.y - b.y) < 230) EDGES.push([i, j]); }));
const netLines = EDGES.map(() => S('line', { stroke: 'rgba(146,161,194,0.10)', 'stroke-width': 1 }, net));
const netDots = NODES.map(() => S('circle', { fill: 'rgba(162,134,156,0.45)' }, net));
function drawNet(t, strength) {
  const pos = NODES.map((n) => [n.x + Math.sin(t * n.s + n.p) * 18, n.y + Math.cos(t * n.s * 0.8 + n.p) * 14]);
  EDGES.forEach(([i, j], k) => { const l = netLines[k]; l.setAttribute('x1', pos[i][0]); l.setAttribute('y1', pos[i][1]); l.setAttribute('x2', pos[j][0]); l.setAttribute('y2', pos[j][1]); l.setAttribute('opacity', strength); });
  NODES.forEach((n, i) => { const c = netDots[i]; c.setAttribute('cx', pos[i][0]); c.setAttribute('cy', pos[i][1]); c.setAttribute('r', n.r); c.setAttribute('opacity', strength); });
}

// ------------------------------------------------------------------ footage
const videos = [];
function footage(clip, { x, y, w, url = 'localhost:8000 · Promise Graph' }) {
  const h = Math.round(w * 9 / 16) + 44;
  const el = $(`<div class="frame" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px">
    <div class="bar"><i></i><i></i><i></i><span>${url}</span></div><div class="view"><video muted playsinline preload="auto" src="clips/${clip}.mp4"></video></div></div>`);
  const v = el.querySelector('video');
  const rec = { el, v, want: null, w, h: h - 44 };
  videos.push(rec);
  // show clip time ct with a zoom: scale s around the clip point (fx, fy) in 0..1 of the clip
  rec.show = (ct, s = 1, fx = 0.5, fy = 0.5) => {
    rec.want = Math.max(0, ct);
    const vw = rec.w * s, vh = vw * 9 / 16;
    const tx = clamp(rec.w / 2 - fx * vw, rec.w - vw, 0), ty = clamp(rec.h / 2 - fy * vh, rec.h - vh, 0);
    v.style.width = vw + 'px'; v.style.transform = `translate(${tx}px, ${ty}px)`;
  };
  return rec;
}

// ------------------------------------------------------------------ scenes
const root = document.getElementById('scenes');
const scenes = {};
function scene(id, build) { const el = $(`<div class="scene" data-id="${id}"></div>`); root.appendChild(el); scenes[id] = { id, el, ...build(el) }; }
let TL, V, SC;     // timeline, lines by id, scenes by id (from timeline.json)
const at = (id) => V[id].at, end = (id) => V[id].at + V[id].dur;
const cues = [];
const cue = (t, kind, extra = {}) => cues.push({ t: +t.toFixed(3), kind, ...extra });

// 1. HOOK -------------------------------------------------------------------------------
scene('hook', (el) => {
  const t1 = $(`<div class="center h-xl" style="top:300px;width:1700px;text-align:center"></div>`); el.appendChild(t1);
  const w1 = words(t1, 'Every order is a promise.');
  const card = $(`<div class="card" style="left:660px;top:470px;width:600px;padding:30px 36px">
    <div style="display:flex;justify-content:space-between;align-items:center"><span class="kick" style="font-size:18px">Order ORD-000730</span><span class="pill green" style="font-size:19px"><i class="dot" style="background:var(--ok)"></i>On track</span></div>
    <div style="font-size:40px;font-weight:720;margin-top:14px">Aisha Rahman</div>
    <div style="display:flex;gap:16px;align-items:center;margin-top:18px;font-size:28px"><span class="muted">Promised</span><b>Dec 14</b></div></div>`);
  el.appendChild(card);
  const pill = card.querySelector('.pill');
  // the map
  const box = { x: 160, y: 120, w: 1600, h: 760, lon0: -125, lon1: 135, lat0: -10, lat1: 60 };
  const map = S('svg', { width: W, height: H, style: 'position:absolute;left:0;top:0' }); el.appendChild(map);
  const lanes = LANES.map(([a, b]) => S('path', { d: arcPath(proj(PORTS[a][1], PORTS[a][2], box), proj(PORTS[b][1], PORTS[b][2], box)), fill: 'none', stroke: 'rgba(146,161,194,.35)', 'stroke-width': 2 }, map));
  const ships = LANES.map((l, i) => S('circle', { r: 5, fill: '#D9A86C' }, map));
  const portDots = Object.entries(PORTS).map(([id, [n, la, lo]]) => { const [x, y] = proj(la, lo, box); const g = S('g', {}, map);
    S('circle', { cx: x, cy: y, r: id === 'SGSIN' ? 11 : 6, fill: id === 'SGSIN' ? '#BD6C73' : '#92A1C2' }, g);
    if (['SGSIN','NLRTM','USLAX','CNSHA','EGPSD','USNYC','LKCMB'].includes(id)) S('text', { x: id === 'SGSIN' ? x - 22 : x + 14, y: id === 'SGSIN' ? y + 40 : y + 6, 'text-anchor': id === 'SGSIN' ? 'end' : 'start', fill: id === 'SGSIN' ? '#E8A3A9' : '#92A1C2', 'font-size': id === 'SGSIN' ? 28 : 18, 'font-weight': id === 'SGSIN' ? 750 : 500 }, g).textContent = id === 'SGSIN' ? 'Port of Singapore · CLOSED' : n;
    return { g, x, y, id }; });
  const sg = proj(1.26, 103.84, box);
  const rings = [0, 1, 2].map(() => S('circle', { cx: sg[0], cy: sg[1], r: 10, fill: 'none', stroke: '#BD6C73', 'stroke-width': 3 }, map));
  // the broken promises (mini cards around)
  const minis = Array.from({ length: 14 }, (_, i) => { const a = (i / 14) * Math.PI * 2 + 0.3, rr = 330 + (i % 3) * 70;
    const m = $(`<div class="card" style="left:${960 + Math.cos(a) * rr * 1.72 - 95}px;top:${560 + Math.sin(a) * rr * 0.86 - 34}px;width:190px;padding:12px 16px;border-radius:14px">
      <div style="font-size:15px;color:var(--text-2)">Promised Dec ${8 + (i * 5) % 17}</div><div class="st" style="font-size:20px;font-weight:750;color:var(--ok)">On time</div></div>`);
    el.appendChild(m); return { m, st: m.querySelector('.st'), d: Math.hypot(Math.cos(a) * rr * 1.72, Math.sin(a) * rr * 0.86) }; });
  const t4 = $(`<div class="center h-l" style="top:540px;width:1500px;text-align:center"></div>`); el.appendChild(t4);
  const w4 = words(t4, 'Which promises just broke?');
  return {
    cues(s) { cue(s.start + 0.6, 'whoosh'); cue(at('h2') + 0.1, 'pop', { i: 2, bright: 1 }); cue(at('h3') + 0.3, 'whoosh', { big: 1 }); cue(at('h3') + 1.6, 'pulse');
      cue(at('h4') - 0.05, 'slam', { big: 1 }); minis.forEach((m, i) => cue(at('h4') + 0.25 + m.d / 1400, 'tick', { i })); },
    render(t) {
      const a1 = at('h1'), a2 = at('h2'), a3 = at('h3'), a4 = at('h4');
      wordsIn(w1, t, a1);
      const out1 = E.inout(P(t, a3 - 0.2, a3 + 0.5));
      set(t1, 1 - out1, `translate(-50%, -50%) translateY(${-out1 * 60}px)`);
      const c = E.back(P(t, a2, a2 + 0.6));
      set(card, P(t, a2, a2 + 0.3) * (1 - out1), `scale(${0.8 + 0.2 * c}) translateY(${out1 * -40}px)`);
      const mapIn = E.out(P(t, a3, a3 + 1.0)), mapOut = P(t, a4 - 0.1, a4 + 0.5);
      map.style.opacity = mapIn * (1 - 0.7 * mapOut);
      map.style.transform = `scale(${1.08 - 0.08 * mapIn + 0.06 * mapOut})`;
      lanes.forEach((l, i) => { const len = 1400; l.style.strokeDasharray = len; l.style.strokeDashoffset = len * (1 - E.out(P(t, a3 + i * 0.03, a3 + 1.2 + i * 0.03))); });
      // ships flow along lanes until the port closes (a3 + 1.4), then the ones near Singapore freeze red
      const freeze = a3 + 1.4;
      ships.forEach((c2, i) => { const l = lanes[i]; const len = l.getTotalLength(); const tt = Math.min(t, freeze + (LANES[i].includes('SGSIN') ? 0 : 99));
        const u = ((tt * 0.09 + i * 0.137) % 1); const p = l.getPointAtLength(u * len); c2.setAttribute('cx', p.x); c2.setAttribute('cy', p.y);
        const stuck = LANES[i].includes('SGSIN') && t > freeze; c2.setAttribute('fill', stuck ? '#BD6C73' : '#D9A86C'); c2.setAttribute('r', stuck ? 7 : 5); c2.style.opacity = mapIn; });
      rings.forEach((r, i) => { const ph = ((t - freeze) * 0.7 + i / 3) % 1; const on = t > freeze ? 1 : 0; r.setAttribute('r', 10 + ph * 80); r.style.opacity = on * (1 - ph) * 0.9; });
      // h4: the promises break in a wave out from the centre
      minis.forEach(({ m, st, d }) => { const ap = a4 - 0.2 + d / 2600; const x = E.back(P(t, ap, ap + 0.5)); set(m, P(t, ap, ap + 0.3), `scale(${0.6 + 0.4 * x})`);
        const br = t > a4 + 0.25 + d / 1400; st.textContent = br ? 'LATE' : 'On time'; st.style.color = br ? 'var(--danger-text)' : 'var(--ok)'; m.style.borderColor = br ? 'rgba(189,108,115,.7)' : ''; });

// ------------------------------------------------------------------ render(t)
const capEl = document.getElementById('cap'), wm = document.getElementById('wm');
let DURATION = 180;
function render(t) {
  // scenes cross-fade at their boundaries
  for (const s of TL.scenes) {
    const sc = scenes[s.id]; if (!sc) continue;
    const fin = s.start === 0 ? 1 : E.out(P(t, s.start - 0.25, s.start + 0.35));
    const fout = s.end >= DURATION ? 1 : 1 - E.inout(P(t, s.end - 0.3, s.end + 0.15));
    const o = Math.min(fin, fout);
    sc.el.style.opacity = o;
    sc.el.style.display = o > 0.001 ? 'block' : 'none';
    sc.el.style.transform = `scale(${1 + (1 - fin) * 0.025 - (1 - fout) * 0.02})`;
    sc.el.style.filter = o < 1 ? `blur(${(1 - o) * 6}px)` : 'none';
    if (o > 0.001) sc.render(t, s);
  }
  // footage only seeks while its scene is on screen
  for (const r of videos) { const op = r.el.style.opacity; const on = r.el.closest('.scene').style.display !== 'none' && (op === '' || +op > 0.001); r.active = on && r.want != null; }
  drawNet(t, 0.55 + 0.45 * Math.sin(t * 0.2) ** 2);
  // captions
  const line = TL.vo.find((v) => t >= v.at - 0.05 && t <= v.at + v.dur + 0.35);
  if (line) { if (capEl.textContent !== line.text) capEl.textContent = line.text; const o = Math.min(P(t, line.at - 0.05, line.at + 0.15), 1 - P(t, line.at + line.dur + 0.15, line.at + line.dur + 0.35)); capEl.style.opacity = o; }
  else capEl.style.opacity = 0;
  wm.style.opacity = t > 17 && t < 170.5 ? 0.85 : 0;
}

const seekVideo = (r) => new Promise((ok) => {
  const v = r.v, want = Math.min(r.want, (v.duration || 1e9) - 0.04);
  if (Math.abs(v.currentTime - want) < 0.004) return ok();
  const done = () => { v.removeEventListener('seeked', done); clearTimeout(to); ok(); };
  const to = setTimeout(done, 2500);
  v.addEventListener('seeked', done); v.currentTime = want;
});
window.__seek = async (t) => {
  render(t);
  await Promise.all(videos.filter((r) => r.active).map(seekVideo));
  await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
  return true;
};
window.__ready = (async () => {
  TL = await (await fetch('build/timeline.json')).json();
  V = Object.fromEntries(TL.vo.map((v) => [v.id, v]));
  SC = Object.fromEntries(TL.scenes.map((s) => [s.id, s]));
  DURATION = TL.duration;
  window.__duration = DURATION;
  for (const s of TL.scenes) scenes[s.id]?.cues?.(s);
  cues.sort((a, b) => a.t - b.t);
  window.__cues = cues;
  await document.fonts.ready;
  await Promise.all(videos.map((r) => new Promise((ok) => { if (r.v.readyState >= 2) return ok(); r.v.addEventListener('loadeddata', ok, { once: true }); setTimeout(ok, 8000); })));
  render(0);
  return true;
})();
// Opened in a browser without ?render: play it in real time (no sound) to preview.
if (!location.search.includes('render')) {
  window.__ready.then(() => { const t0 = performance.now(); const tick = async () => { const t = ((performance.now() - t0) / 1000) % DURATION; render(t);
    for (const r of videos) if (r.active) { if (Math.abs(r.v.currentTime - r.want) > 0.25) r.v.currentTime = r.want; } requestAnimationFrame(tick); }; tick(); });
}
